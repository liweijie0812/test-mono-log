name: On Branch Delete
on:
  delete:
jobs:
  notify-deletion:
    runs-on: ubuntu-latest
    steps:
      - name: 发送删除通知
        run: |
          echo "分支 ${{ github.ref }} 已被删除"
          # 可调用 API 发送通知到 Slack、Teams 等
      - name: 发送 Slack 通知（可选）
        if: github.ref == 'refs/heads/develop'  # 仅对 develop 分支删除生效
        run: |
         echo "分支 ${{ github.ref_name }} 已被删除"
