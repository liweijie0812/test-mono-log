name: 分支删除通知
on:
  delete:
    branches:
      - '**'  # 监听所有分支删除

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 输出删除信息
        run: |
          echo "检测到分支删除事件！"
          echo "完整引用路径: ${{ github.ref }}"
          echo "分支名: ${{ github.ref_name }}"
          echo "删除者: ${{ github.actor }}"
        shell: bash
