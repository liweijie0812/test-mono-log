# 当 issue 被创建时，自动回复引导完善信息
name: Issue Welcome

on:
  issues:
    types: [opened]

jobs:
  call-issue-welcome:
    run:
    uses: TDesignOteam/workflows/.github/workflows/reusable-issue-welcome@reusable-issue
    with:
      issue-number: ${{ github.event.issue.number }}
      login: ${{ github.event.issue.user.login }}
